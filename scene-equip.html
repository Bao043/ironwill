<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>居家消防器材：裝在哪裡？</title>
<style>
:root{
  --bg:#07090b;--ink:#eceeea;--ink2:#b0b8ba;--muted:#7f898d;--line:#2a3135;
  --panel:rgba(16,20,24,.94);--panel2:#161b1f;--ok:#2fa66a;--warn:#e3b64e;--bad:#d9483b;--gold:#f2c14e;--blue:#2f62d6;
  --font:'Noto Sans TC',-apple-system,'PingFang TC','Microsoft JhengHei',sans-serif;
  --num:'Barlow Condensed','Arial Narrow',sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:var(--font)}
body{display:flex;flex-direction:column;min-height:100%;overflow-x:hidden}
button{font-family:inherit;cursor:pointer}
.top{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:10px;padding:calc(env(safe-area-inset-top,0px) + 12px) 16px 10px;background:linear-gradient(#07090bee,#07090bcc);backdrop-filter:blur(8px)}
.top .st{width:40px;height:40px;border-radius:50%;background:#fff;color:#111;display:grid;place-items:center;font:700 20px var(--num);flex:none}
.top h1{margin:0;font-size:16px;line-height:1.3}
.top p{margin:2px 0 0;font-size:12.5px;color:var(--ink2)}
.top .x{margin-left:auto;width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:#11161a;color:var(--ink);font-size:18px;flex:none}
.prog{display:flex;gap:6px;padding:0 16px 10px}
.prog i{flex:1;height:4px;border-radius:2px;background:#232a2f}
.prog i.on{background:var(--gold)}.prog i.done{background:var(--ok)}
main{flex:1;width:100%;max-width:760px;margin:0 auto;padding:0 16px 24px}
.q{margin:6px 0 10px;padding:14px 16px;border:1px solid var(--line);border-radius:16px;background:var(--panel2)}
.q small{display:block;color:var(--gold);font-size:12.5px;letter-spacing:.08em;margin-bottom:4px}
.q b{display:block;font-size:17px;line-height:1.5}
.q span{display:block;margin-top:6px;font-size:13.5px;line-height:1.6;color:var(--ink2)}
.stage{position:relative;border:1px solid var(--line);border-radius:16px;background:#0e1316;overflow:hidden}
.stage svg{display:block;width:100%;height:auto;touch-action:manipulation}
.wall{stroke:#e9edef;stroke-width:7;fill:none;stroke-linecap:square}
.wall2{stroke:#e9edef;stroke-width:4;fill:none}
.room{fill:#141b20}
.rl{fill:#c9d0d3;font-size:28px;font-weight:600;font-family:var(--font)}
.furn{fill:none;stroke:#8d989d;stroke-width:2.2}
.door{fill:none;stroke:#8d989d;stroke-width:2}
.tgt{cursor:pointer}
.tgt circle.r{fill:rgba(242,193,78,.16);stroke:var(--gold);stroke-width:3}
.tgt text{fill:#fff;font-family:var(--num);font-weight:700;text-anchor:middle;dominant-baseline:central;pointer-events:none}
.tgt.x{opacity:.45}
.sl{fill:#c9d0d3;font-size:17px;text-anchor:middle;font-family:var(--font)}
.tgt.pick circle.r{fill:rgba(47,98,214,.35);stroke:#7ea2ff}
.tgt.ok circle.r{fill:rgba(47,166,106,.35);stroke:var(--ok)}
.tgt.no circle.r{fill:rgba(217,72,59,.3);stroke:var(--bad)}
.chips{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.chip{display:flex;align-items:center;gap:10px;min-height:52px;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:#11171b;color:var(--ink);text-align:left;font-size:14.5px;line-height:1.4}
.chip.wide{grid-column:1/-1}
.chip b{flex:none;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:rgba(242,193,78,.16);border:2px solid var(--gold);font:700 15px var(--num)}
.chip.ok{border-color:var(--ok);background:#12261d}.chip.ok b{border-color:var(--ok);background:var(--ok)}
.chip.no{border-color:var(--bad);background:#2a1513}.chip.no b{border-color:var(--bad);background:var(--bad)}
.chip.pick{border-color:var(--warn);background:#2a2412}.chip.pick b{border-color:var(--warn);background:var(--warn);color:#1a1204}
.chip.x{opacity:.5}.chip:disabled{cursor:default}
.rlist{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin-top:10px}
.rbtn{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:48px;padding:8px 12px;border-radius:12px;border:1px solid var(--line);background:#11171b;color:var(--ink);font-size:14.5px}
.rbtn b{display:inline-flex;align-items:center;gap:6px;font-size:14px}.rbtn b i{width:12px;height:12px;border-radius:50%;border:2px solid}
.demo svg{display:block;width:100%;margin-top:8px;border-radius:12px;background:#0e1316}
.demo>b{font-size:14px}
.go.alt.on{border-color:var(--gold);color:var(--gold)}
.rm{cursor:pointer}
.rm rect.h{fill:transparent;stroke:transparent;stroke-width:3}
.rm.sel rect.h{fill:rgba(242,193,78,.08)}

.legend{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 0;font-size:12.5px;color:var(--ink2)}
.legend span{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:99px;border:1px solid var(--line);background:#11161a}
.legend i{width:10px;height:10px;border-radius:50%}
.btns{display:flex;gap:10px;margin-top:12px}
.go{flex:1;display:flex;align-items:center;justify-content:center;gap:10px;min-height:52px;border-radius:14px;border:0;background:#f4f1ea;color:#121416;font-size:16px;font-weight:700}
.go.alt{background:#1b2227;color:var(--ink);border:1px solid var(--line)}
.go:disabled{opacity:.4;cursor:default}
.opts{display:grid;gap:10px;margin-top:12px}
.card{display:flex;align-items:center;gap:12px;padding:14px 16px;border-radius:14px;border:1px solid var(--line);background:#11171b;color:var(--ink);text-align:left;font-size:15px;line-height:1.5}
.card .k{margin-left:auto;width:28px;height:28px;border-radius:50%;border:1px solid #4a555b;display:grid;place-items:center;font:700 14px var(--num);flex:none;color:var(--ink2)}
.card.on{border-color:#7ea2ff;background:#16213a}
.fb{position:fixed;left:0;right:0;bottom:0;z-index:20;max-height:78vh;overflow:auto;padding:18px 18px calc(env(safe-area-inset-bottom,0px) + 16px);background:var(--panel);border-top:1px solid var(--line);border-radius:20px 20px 0 0;box-shadow:0 -12px 40px rgba(0,0,0,.6);transform:translateY(105%);transition:transform .35s cubic-bezier(.2,.9,.3,1)}
.fb.on{transform:none}
.res{margin-top:14px;padding:16px;border:1px solid var(--line);border-radius:16px;background:var(--panel2);animation:resIn .35s ease}
@keyframes resIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.acap{display:flex;align-items:flex-start;gap:10px;min-height:48px;margin-top:10px;padding:10px 12px;border-radius:12px;background:#10171b;border:1px solid #24313a;font-size:14.5px;line-height:1.6}
.acap .an{flex:none;padding:2px 8px;border-radius:99px;background:var(--gold);color:#1a1204;font-size:12px;font-weight:700;margin-top:2px}
.acap .skp{margin-left:auto;flex:none;border:1px solid var(--line);background:#161d22;color:var(--ink2);border-radius:99px;padding:4px 10px;font-size:12.5px}
[hidden]{display:none!important}
.fx-me{fill:#7ea2ff;stroke:#0e1316;stroke-width:3}
.fx-lbl{fill:#eceeea;font-size:22px;font-family:var(--font);font-weight:600;paint-order:stroke;stroke:#0e1316;stroke-width:5px}
.fx-s{fill:#eceeea;font-size:15px;font-family:var(--font);font-weight:600;paint-order:stroke;stroke:#0e1316;stroke-width:4px}
.fb .in{max-width:720px;margin:0 auto}
.fbh{display:flex;align-items:center;gap:12px}
.badge{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;flex:none;font-size:22px;font-weight:800}
.badge.ok{background:var(--ok)}.badge.mid{background:var(--warn);color:#1a1204}.badge.bad{background:var(--bad)}
.fbh h3{margin:0;font-size:19px}.fbh p{margin:2px 0 0;font-size:13px;color:var(--ink2)}
.fbh .pt{margin-left:auto;font:700 26px var(--num)}.fbh .pt small{font-size:15px;color:var(--ink2)}
.why{margin:12px 0 0;font-size:14.5px;line-height:1.7}
.rows{display:grid;gap:6px;margin-top:10px}
.rows div{display:flex;gap:8px;align-items:flex-start;padding:8px 10px;border-radius:10px;background:#11171b;font-size:13.5px;line-height:1.5}
.rows i{font-style:normal;font-weight:800;flex:none;width:18px;text-align:center}
.rows .ok i{color:var(--ok)}.rows .bad i{color:var(--bad)}.rows .mid i{color:var(--warn)}
.kc{display:flex;gap:10px;margin-top:12px;padding:12px;border-radius:12px;border:1px solid #3b3424;background:#1a1810}
.kc b{display:block;color:var(--gold);font-size:14px;margin-bottom:4px}
.kc span{font-size:13px;line-height:1.7;color:#e3dccb}
.demo{margin-top:12px}
.demo .bar{height:8px;border-radius:4px;background:#232a2f;overflow:hidden;margin-top:6px}
.demo .bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--ok),var(--gold),var(--bad))}
.demo p{margin:6px 0 0;font-size:13px;color:var(--ink2);line-height:1.6}
.end h2{margin:8px 0 4px;font-size:22px}
.rk{display:flex;align-items:center;gap:14px;margin:10px 0}
.rk .L{width:64px;height:64px;border-radius:50%;border:3px solid var(--gold);display:grid;place-items:center;font:800 34px var(--num);color:var(--gold)}
.rk p{margin:2px 0 0;color:var(--ink2);font-size:13.5px}
.sec{margin:18px 0 8px;font-size:13px;letter-spacing:.12em;color:var(--gold)}
.src{margin-top:16px;font-size:12px;line-height:1.7;color:var(--muted)}
.blink{animation:bl .5s steps(2) infinite}@keyframes bl{50%{opacity:.25}}
.flow{stroke-dasharray:8 8;animation:fl 1s linear infinite}@keyframes fl{to{stroke-dashoffset:-16}}
@media (min-width:700px){.q b{font-size:19px}}
</style>
</head>
<body>
<div class="top"><div class="st" id="stN">1</div><div><h1 id="stT">居家消防器材：裝在哪裡？</h1><p id="stP">滅火器、住警器、瓦斯偵測器、一氧化碳警報器</p></div><button class="x" id="exitB" type="button" aria-label="離開">✕</button></div>
<div class="prog" id="prog"></div>
<main id="main"></main>

<script>
(function(){
var IN_FRAME=false;try{IN_FRAME=window.parent!==window}catch(e){IN_FRAME=true}
function toParent(m){try{if(IN_FRAME)window.parent.postMessage(m,'*')}catch(e){}}
function $(id){return document.getElementById(id)}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
var SCORE=[],CARDS=[],TIMERS=[],FAST=false;
function later(fn,ms){var t=setTimeout(fn,FAST?1:ms);TIMERS.push(t);return t}
function clearLater(){TIMERS.forEach(clearTimeout);TIMERS=[];ANIM.id++}
function clamp(v,a,b){return v<a?a:v>b?b:v}
function lerp(a,b,t){return a+(b-a)*t}
function seg(t,a,b){return clamp((t-a)/(b-a),0,1)}
function ease(t){return t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2}
/* 沿著折線走：pts=[[x,y],...]，u=0~1 */
function along(pts,u){
  var L=[],tot=0,i;for(i=1;i<pts.length;i++){var d=Math.hypot(pts[i][0]-pts[i-1][0],pts[i][1]-pts[i-1][1]);L.push(d);tot+=d}
  var r=u*tot;for(i=0;i<L.length;i++){if(r<=L[i]||i===L.length-1){var k=L[i]?clamp(r/L[i],0,1):0;return [lerp(pts[i][0],pts[i+1][0],k),lerp(pts[i][1],pts[i+1][1],k)]}r-=L[i]}
  return pts[pts.length-1];
}
function poly(pts,u){var out=[pts[0]],L=0,i,tot=0,seg2=[];for(i=1;i<pts.length;i++){var d=Math.hypot(pts[i][0]-pts[i-1][0],pts[i][1]-pts[i-1][1]);seg2.push(d);tot+=d}
  var r=u*tot;for(i=0;i<seg2.length;i++){if(r>=seg2[i]){out.push(pts[i+1]);r-=seg2[i]}else{var k=seg2[i]?r/seg2[i]:0;out.push([lerp(pts[i][0],pts[i+1][0],k),lerp(pts[i][1],pts[i+1][1],k)]);break}}
  return 'M'+out.map(function(p){return p[0].toFixed(1)+' '+p[1].toFixed(1)}).join('L')}
/* ---------- 動畫：畫在題目圖上的 #fx 圖層，說明文字放在圖下方（不會擋到圖） ---------- */
var ANIM={id:0};
function play(steps,done){
  /* steps：[{d:毫秒, cap:'說明', draw:function(t){return svg字串}}] 依序播放 */
  var id=++ANIM.id,k=0,cap=$('acap'),fx=document.querySelector('#stg svg #fx');
  if(!fx){var sv=document.querySelector('#stg svg');if(sv){fx=document.createElementNS('http://www.w3.org/2000/svg','g');fx.setAttribute('id','fx');sv.appendChild(fx)}}
  if(cap){cap.hidden=false;cap.innerHTML='<span class="an">動畫</span><span id="acapT"></span><button type="button" class="skp" id="askip">跳過</button>';$('askip').onclick=function(){finish()}}
  function finish(){if(id!==ANIM.id)return;ANIM.id++;var last=steps[steps.length-1];if(fx)fx.innerHTML=last.draw(1);if($('acapT'))$('acapT').textContent=last.cap;var b=$('askip');if(b)b.remove();done&&done()}
  function run(){
    if(id!==ANIM.id)return;if(k>=steps.length){finish();return}
    var S=steps[k],t0=performance.now(),D=FAST?1:S.d;if($('acapT'))$('acapT').textContent=S.cap;
    function f(now){if(id!==ANIM.id)return;var t=clamp((now-t0)/D,0,1);if(fx)fx.innerHTML=S.draw(t);if(t<1)requestAnimationFrame(f);else{k++;run()}}
    requestAnimationFrame(f);
  }
  run();
  return finish;
}
/* ---------- 平面圖（依講師提供的示意圖：廚房、客廳、走廊、主臥室、客房、家中大門） ---------- */
function planInner(extra){
  return '<rect class="room" x="45" y="25" width="720" height="440"/>'+
  '<path class="wall" d="M45 25H765V258H600M45 25V465H600V258"/>'+
  '<path class="wall" d="M45 165H400V25"/>'+
  '<path class="wall2" d="M45 258H600M322 258V465"/>'+
  '<path d="M352 103V160" stroke="#141b20" stroke-width="9"/><path class="door" d="M400 103A55 55 0 0 0 352 158M352 158H400"/>'+
  '<path d="M268 258H316" stroke="#141b20" stroke-width="9"/><path class="door" d="M268 258A48 48 0 0 0 316 306M316 258V306"/>'+
  '<path d="M545 258H596" stroke="#141b20" stroke-width="9"/><path class="door" d="M545 258A50 50 0 0 0 596 308M596 258V308"/>'+
  '<path d="M660 258H735" stroke="#141b20" stroke-width="9"/><path class="door" d="M660 258A70 70 0 0 0 732 330M735 258V330"/>'+
  '<text x="698" y="368" fill="#c9d0d3" font-size="22" text-anchor="middle">家中</text><text x="698" y="394" fill="#c9d0d3" font-size="22" text-anchor="middle">大門</text>'+
  '<path d="M698 405V440" stroke="#c9d0d3" stroke-width="3"/><path d="M688 428L698 442L708 428" fill="none" stroke="#c9d0d3" stroke-width="3"/>'+
  '<rect class="furn" x="138" y="33" width="80" height="32" rx="6"/><circle cx="160" cy="49" r="4" fill="#8d989d"/><circle cx="196" cy="49" r="4" fill="#8d989d"/>'+
  '<rect class="furn" x="58" y="95" width="48" height="56" rx="4"/><circle cx="72" cy="112" r="7" class="furn"/><circle cx="92" cy="112" r="7" class="furn"/><circle cx="72" cy="134" r="7" class="furn"/><circle cx="92" cy="134" r="7" class="furn"/>'+
  '<rect class="furn" x="482" y="45" width="44" height="105" rx="8"/><rect class="furn" x="490" y="55" width="28" height="40"/><rect class="furn" x="490" y="100" width="28" height="40"/>'+
  '<rect class="furn" x="418" y="62" width="10" height="70"/>'+
  '<rect class="furn" x="232" y="342" width="78" height="96" rx="4"/><rect class="furn" x="238" y="348" width="30" height="16" rx="3"/><rect class="furn" x="274" y="348" width="30" height="16" rx="3"/>'+
  '<rect class="furn" x="98" y="412" width="80" height="34" rx="6"/><rect class="furn" x="62" y="356" width="18" height="90"/>'+
  '<rect class="furn" x="345" y="342" width="58" height="96" rx="4"/><rect class="furn" x="352" y="348" width="44" height="16" rx="3"/>'+
  '<rect x="33" y="60" width="12" height="50" fill="#0e1316" stroke="#e9edef" stroke-width="2"/><rect x="33" y="185" width="12" height="50" fill="#0e1316" stroke="#e9edef" stroke-width="2"/><rect x="33" y="300" width="12" height="50" fill="#0e1316" stroke="#e9edef" stroke-width="2"/>'+
  '<text class="rl" x="280" y="92">廚房</text><text class="rl" x="585" y="92">客廳</text><text class="rl" x="168" y="226" fill="#8d989d">走廊</text>'+
  '<text class="rl" x="92" y="320">主臥室</text><text class="rl" x="430" y="318">客房</text>'+
  (extra||'');
}
function plan(extra){return '<svg viewBox="0 0 800 500" role="img" aria-label="住家平面圖：廚房、客廳、走廊、主臥室、客房、家中大門">'+planInner(extra)+'<g id="fx"></g></svg>'}
function fire(x,y,s){s=s||1;return '<g transform="translate('+x.toFixed(1)+' '+y.toFixed(1)+') scale('+s.toFixed(2)+')"><path d="M0 18C-14 18-18 6-12-4-10 4-6 6-6 6-8-6 0-16 2-24 6-14 16-8 14 4 12 14 6 18 0 18Z" fill="#ff8a3d"/><path d="M0 18C-6 18-8 12-4 6-2 10 2 10 2 2 6 8 8 14 0 18Z" fill="#ffd36b"/></g>'}
function extIcon(x,y,s){s=s||1;return '<g transform="translate('+x.toFixed(1)+' '+y.toFixed(1)+') scale('+s+')"><rect x="-7" y="-14" width="14" height="30" rx="5" fill="#c42d22" stroke="#0e1316" stroke-width="2"/><rect x="-3" y="-20" width="6" height="7" fill="#333"/><path d="M3 -18h9" stroke="#333" stroke-width="3"/></g>'}
function me(x,y,lab){return '<circle class="fx-me" cx="'+x.toFixed(1)+'" cy="'+y.toFixed(1)+'" r="12"/>'+(lab?'<text class="fx-s" x="'+x.toFixed(1)+'" y="'+(y-20).toFixed(1)+'" text-anchor="middle">'+lab+'</text>':'')}
function xMark(x,y){return '<path d="M'+(x-16)+' '+(y-16)+'l32 32M'+(x+16)+' '+(y-16)+'l-32 32" stroke="#d9483b" stroke-width="7" stroke-linecap="round"/>'}
function waves(x,y,t,c){var h='';for(var i=0;i<3;i++){var k=(((t*1.6+i/3)%1)+1)%1;h+='<circle cx="'+x+'" cy="'+y+'" r="'+(14+k*46).toFixed(1)+'" fill="none" stroke="'+(c||'#d9483b')+'" stroke-width="3" opacity="'+(1-k).toFixed(2)+'"/>'}return h}
/* 可以點的位置：圓圈加英文字母；說明文字放在圖下方的選項按鈕上 */
function tgt(id,x,y,r){r=r||26;return '<g class="tgt" data-id="'+id+'"><circle class="r" cx="'+x+'" cy="'+y+'" r="'+r+'"/><text x="'+x+'" y="'+y+'" font-size="'+Math.round(r*1.05)+'">'+id+'</text></g>'}
function chips(list){return '<div class="chips" id="chips">'+list.map(function(c){return '<button type="button" class="chip" data-id="'+c[0]+'"><b>'+c[0]+'</b><span>'+esc(c[1])+'</span></button>'}).join('')+'</div>'}
function bindPick(fn){
  var lock=false;
  function go(id){if(lock)return;lock=true;fn(id)}
  [].forEach.call(document.querySelectorAll('#stg .tgt'),function(g){g.addEventListener('click',function(){go(g.dataset.id)})});
  [].forEach.call(document.querySelectorAll('#chips .chip'),function(b){b.addEventListener('click',function(){go(b.dataset.id)})});
}
function markPick(id,ans,midIds){
  midIds=midIds||[];
  [].forEach.call(document.querySelectorAll('#stg .tgt,#chips .chip'),function(t){var k=t.dataset.id;
    t.classList.add(k===ans?'ok':k===id?(midIds.indexOf(id)>=0?'pick':'no'):'x');if(t.tagName==='BUTTON')t.disabled=true});
}
/* ---------- 回合 ---------- */
var R=[
 {key:'ext',t:'滅火器放哪裡？',sub:'住宅用滅火器的擺放位置',max:20},
 {key:'alarm',t:'住宅用火災警報器',sub:'每個房間選對種類',max:25},

    if(id!=='A')S.push({d:4600,cap:'裝在正確的位置 A（臥室門口的走廊天花板）：一氧化碳一飄過來就響，關著房門也聽得到。',draw:coDraw('A','co')});
    function show(){result(head(G,G==='ok'?'位置正確！':G==='mid'?'可以，但還能更好':'再想想','最好的位置：A 臥室門口的走廊',pts,15)+'<p class="why">'+esc(W[id])+'</p>'+
      kc('一氧化碳警報器：裝在生活、睡覺的區域','裝在客廳、臥室附近等生活區域的天花板，關著房門也要聽得到警報。離燃氣熱水器、瓦斯爐等燃燒器具 1.5 公尺以上，也離冷氣出風口 1.5 公尺以上。最根本的是：燃氣熱水器要裝在室外通風良好的地方。'),'看成績單',next,function(){stageTop();play(S,function(){})})}
    stageTop();later(function(){play(S,show)},350);
  });
};
function end(){
  prog();var got=0,max=0;SCORE.forEach(function(s){got+=s.got;max+=s.max});var T=Math.round(got/max*100),r=T>=92?'S':T>=78?'A':T>=55?'B':'C';
  var RT={S:'家裡的消防安全顧問',A:'裝得很到位',B:'大致正確，還能更好',C:'值得再練一次'};
  var h='<div class="end"><div class="rk"><div class="L">'+r+'</div><div><h2>'+RT[r]+'</h2><p>總分 '+T+' / 100</p></div></div><div class="sec">每一題</div><div class="rows">';
  SCORE.forEach(function(s){h+='<div class="'+s.g+'"><i>'+(s.g==='ok'?'✓':s.g==='bad'?'✕':'–')+'</i><span><b>'+esc(s.t)+'</b>　'+s.got+' / '+s.max+'</span></div>'});
  h+='</div><div class="sec">知識卡總整理</div>';CARDS.forEach(function(c){h+='<div class="kc"><div><b>'+esc(c.t)+'</b><span>'+esc(c.s)+'</span></div></div>'});
  h+='<div class="btns"><button class="go" id="again" type="button">再玩一次</button><button class="go alt" id="bye" type="button">'+(IN_FRAME?'回情境學院':'離開')+'</button></div>'+
    '<p class="src">資料來源：滅火器擺放觀念由 IRON WILL 講師提供。住宅用火災警報器的種類與安裝位置，參考內政部消防署住警器宣導資料（偵煙式、定溫式；裝天花板距牆或樑 60 公分以上，裝牆面距天花板 15～50 公分）。瓦斯偵測器的安裝高度參考廠商安裝說明（天然氣：天花板下 30 公分內；液化石油氣：地板上 30 公分內）與各類場所消防安全設備設置標準。一氧化碳警報器參考桃園市政府消防局「一氧化碳偵測警報器設置原則」（裝天花板，距燃燒器具及出風口 1.5 公尺以上，關門也聽得到）。動畫是幫助理解的示意，煙、瓦斯擴散的時間不是實測數據。標示「待對照官方原文」的內容，教學前請以主管機關最新公布的版本為準。</p></div>';
  $('main').innerHTML=h;window.scrollTo(0,0);
  $('again').onclick=function(){start()};$('bye').onclick=exit;
  try{var d=JSON.parse(localStorage.getItem('iw-day')||'{}')||{};d.equip={r:r,s:T};localStorage.setItem('iw-day',JSON.stringify(d))}catch(e){}
}
function exit(){if(IN_FRAME){toParent({iw:'close'});return}try{history.back()}catch(e){}}
function start(){clearLater();SCORE=[];CARDS=[];ri=0;prog();RUN.ext();window.scrollTo(0,0)}
$('exitB').onclick=exit;
/* 測試用 */
window.__eq={ri:function(){return ri},score:function(){return SCORE},fbGo:function(){var b=$('fbGo');if(b)b.click()},fast:function(v){FAST=!!v},
  pick:function(id){var c=document.querySelector('#chips .chip[data-id="'+id+'"]');if(c)c.click()},
  alarmGood:function(){RUN.alarm.set({kit:'heat',liv:'smoke',hall:'smoke',mbr:'smoke',gst:'smoke'});$('chk').click()}};
start();toParent({iw:'ready'});
})();
</script>
